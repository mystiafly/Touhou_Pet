<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#282a36"/>
      <stop offset="100%" stop-color="#191a21"/>
    </linearGradient>
    <linearGradient id="robotHead" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6272a4"/>
      <stop offset="100%" stop-color="#44475a"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1f29"/>
      <stop offset="100%" stop-color="#13141c"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8be9fd"/>
      <stop offset="100%" stop-color="#50fa7b"/>
    </linearGradient>
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff79c6"/>
      <stop offset="100%" stop-color="#bd93f9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="100" cy="100" r="96" fill="url(#bgGrad)" stroke="#6272a4" stroke-width="4"/>

  <!-- Antenna -->
  <line x1="100" y1="45" x2="100" y2="25" stroke="#8be9fd" stroke-width="4" stroke-linecap="round"/>
  <circle cx="100" cy="22" r="7" fill="url(#pinkGrad)" filter="url(#glow)"/>

  <!-- Robot Ears -->
  <rect x="30" y="80" width="12" height="30" rx="6" fill="url(#pinkGrad)"/>
  <rect x="158" y="80" width="12" height="30" rx="6" fill="url(#pinkGrad)"/>

  <!-- Head Chassis -->
  <rect x="38" y="45" width="124" height="100" rx="26" fill="url(#robotHead)" stroke="#8be9fd" stroke-width="2"/>

  <!-- Screen Face -->
  <rect x="48" y="55" width="104" height="80" rx="18" fill="url(#screenGrad)" stroke="#6272a4" stroke-width="2"/>

  <!-- Glowing Eyes (Curved Happy Anime Eyes) -->
  <path d="M 65 92 Q 76 80 87 92" fill="none" stroke="url(#cyanGlow)" stroke-width="5" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M 113 92 Q 124 80 135 92" fill="none" stroke="url(#cyanGlow)" stroke-width="5" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Blush Cheeks -->
  <ellipse cx="68" cy="108" rx="8" ry="4" fill="#ff79c6" opacity="0.7" filter="url(#glow)"/>
  <ellipse cx="132" cy="108" rx="8" ry="4" fill="#ff79c6" opacity="0.7" filter="url(#glow)"/>

  <!-- Cute Mouth -->
  <path d="M 94 104 Q 100 112 106 104" fill="none" stroke="#8be9fd" stroke-width="3" stroke-linecap="round"/>

  <!-- Neck -->
  <rect x="86" y="148" width="28" height="12" rx="4" fill="#44475a"/>

  <!-- Body Shoulders -->
  <path d="M 55 160 Q 100 152 145 160 L 160 192 Q 100 196 40 192 Z" fill="url(#robotHead)" stroke="#8be9fd" stroke-width="2"/>
  <!-- Core Light -->
  <circle cx="100" cy="176" r="6" fill="url(#cyanGlow)" filter="url(#glow)"/>
</svg>