        <section id="allocation-view" class="content-section" :class="{ active: activeView === 'allocation-view' }">
            <header class="section-header">
                <h1>大模型分配 (LLM Allocation)</h1>
                <p>为三段式智能体架构独立分配最适合的大脑引擎</p>
            </header>
            
            <div class="card-container">
                <div class="settings-card">
                    <h3><i class="fas fa-network-wired"></i> 阶段引擎分配</h3>
                    <div class="form-group" style="margin-bottom: 15px;">
                        <label for="pre-api-provider-select">前置辅助模型 (Pre-LLM): <span class="help-text" style="display:inline; margin-left:10px;">负责工具调用、意图识别（建议: 快速/廉价模型）</span></label>
                        <select id="pre-api-provider-select" class="modern-select">
                            <option value="inherit">=== 继承主对话模型 ===</option>
                        </select>
                    </div>
                    <div class="form-group" style="margin-bottom: 15px;">
                        <label>主对话模型 (Main-LLM): <span class="help-text" style="display:inline; margin-left:10px;">请在“大脑引擎”面板配置</span></label>
                        <input type="text" class="modern-input" id="main-api-provider-display" disabled style="background-color: var(--card-bg);" value="前往[大脑引擎]面板修改">
                    </div>
                    <div class="form-group">
                        <label for="post-api-provider-select">后置填表模型 (Post-LLM): <span class="help-text" style="display:inline; margin-left:10px;">负责读取对话总结并更新 DataBank（建议: 快速/廉价模型）</span></label>
                        <select id="post-api-provider-select" class="modern-select">
                            <option value="inherit">=== 继承主对话模型 ===</option>
                        </select>
                    </div>

                </div>

                <div class="settings-card">
                    <h3><i class="fas fa-eye"></i> 多阶段提示词透视</h3>
                    <div class="form-group">
                        <p class="help-text">在不同阶段，大模型看到的 Prompt 是不同的。点击透视，对比三个阶段实际接收到的上下文。</p>
                        <button id="preview-prompt-btn" class="action-btn outline">
                            <i class="fas fa-eye"></i> 三段式提示词透视 (X-Ray)
                        </button>
                    </div>
                </div>
            </div>
        </section>
