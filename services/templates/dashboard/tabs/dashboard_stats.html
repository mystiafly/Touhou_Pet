        <section id="dashboard-stats-view" class="content-section">
            <header class="section-header">
                <h1>数据仪表盘 (Statistics)</h1>
                <p>全面洞察大贤者系统及各角色的运行状态与互动数据</p>
            </header>
            
            <div class="card-container" style="grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));">
                <!-- 总计时间卡片 -->
                <div class="settings-card" style="grid-column: 1 / -1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px; background: linear-gradient(145deg, rgba(30,31,41,0.9), rgba(40,42,54,0.9)); border: 1px solid rgba(139, 233, 253, 0.3);">
                    <h2 style="color: #8be9fd; margin-bottom: 10px; font-size: 18px;">系统总运行时间</h2>
                    <div id="stats-total-time" style="font-size: 48px; font-weight: bold; color: #ffb86c; text-shadow: 0 0 15px rgba(255, 184, 108, 0.5); font-family: 'Consolas', 'Courier New', monospace;">0h 0m</div>
                </div>

                <!-- 角色使用占比 (Pie Chart) -->
                <div class="settings-card">
                    <h2>角色陪伴时长占比</h2>
                    <div style="position: relative; height: 250px; width: 100%;">
                        <canvas id="chart-character-time"></canvas>
                    </div>
                </div>

                <!-- 每周使用统计 (Bar Chart) -->
                <div class="settings-card">
                    <h2>过去7天活跃时长 (分钟)</h2>
                    <div style="position: relative; height: 250px; width: 100%;">
                        <canvas id="chart-weekly-usage"></canvas>
                    </div>
                </div>

                <!-- 每日对话活跃度 (Line Chart) -->
                <div class="settings-card" style="grid-column: 1 / -1;">
                    <h2>过去7天对话活跃度 (次数)</h2>
                    <div style="position: relative; height: 300px; width: 100%;">
                        <canvas id="chart-daily-dialogs"></canvas>
                    </div>
                </div>

                <!-- 每日开关机记录 -->
                <div class="settings-card" style="grid-column: 1 / -1;">
                    <h2>近期活动日志</h2>
                    <div class="table-container" style="max-height: 250px; overflow-y: auto;">
                        <table id="stats-activity-table" style="width: 100%; text-align: left; border-collapse: collapse;">
                            <thead>
                                <tr style="border-bottom: 1px solid rgba(255,255,255,0.1);">
                                    <th style="padding: 10px;">日期</th>
                                    <th style="padding: 10px;">系统唤醒时间 (Open)</th>
                                    <th style="padding: 10px;">系统休眠时间 (Close)</th>
                                </tr>
                            </thead>
                            <tbody>
                                <!-- 动态填充 -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </section>
