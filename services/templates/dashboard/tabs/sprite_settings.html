        <section id="sprite-settings-view" class="content-section">
            <header class="section-header">
                <h1>立绘设置</h1>
                <p>管理当前角色的多套立绘与动态表情</p>
            </header>
            
            <div class="card-container">
                <div class="settings-card" style="grid-column: 1 / -1;">
                    <h2>套装管理</h2>
                    <div style="display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap;">
                        <select id="sprite-set-select" class="theme-select" style="flex: 1; min-width: 200px; padding: 10px; background: rgba(0,0,0,0.5); color: #fff; border: 1px solid #ff79c6; border-radius: 5px;">
                        </select>
                        <button id="set-active-sprite-btn" class="action-btn">
                            <i class="fas fa-check"></i> 设为当前使用
                        </button>
                        <button id="rename-sprite-set-btn" class="action-btn outline">
                            <i class="fas fa-edit"></i> 重命名
                        </button>
                        <button id="create-sprite-set-btn" class="action-btn outline">
                            <i class="fas fa-plus"></i> 新建普通套装
                        </button>
                        <button id="open-import-live2d-modal-btn" class="action-btn" style="background: linear-gradient(135deg, #bd93f9, #ff79c6); border: none; color: #fff;">
                            <i class="fas fa-file-archive"></i> 导入 Live2D 模型 (.zip)
                        </button>
                    </div>
                </div>

                <div class="settings-card" style="grid-column: 1 / -1;">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                        <h2 style="margin: 0;">立绘/模型预览与管理</h2>
                        <span id="sprite-set-type-badge" class="badge" style="background: rgba(80, 250, 123, 0.2); color: #50fa7b; border: 1px solid #50fa7b; padding: 4px 10px; border-radius: 12px; font-size: 12px;">🎨 普通立绘</span>
                    </div>
                    
                    <!-- Live2D 动态模型专属预览容器 -->
                    <div id="live2d-preview-box" class="hidden" style="display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(0,0,0,0.3); border: 1px dashed #bd93f9; border-radius: 8px; padding: 20px; margin-bottom: 20px;">
                        <div style="position: relative; width: 320px; height: 380px; background: rgba(40,42,54,0.6); border-radius: 8px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.5);">
                            <canvas id="dashboard-live2d-canvas" style="width: 100%; height: 100%; object-fit: contain; cursor: grab;"></canvas>
                        </div>

                        <!-- 剪裁与缩放调整工具条 -->
                        <div style="width: 100%; max-width: 500px; background: rgba(0,0,0,0.25); border: 1px solid rgba(189, 147, 249, 0.3); border-radius: 8px; padding: 12px 18px; margin-top: 15px;">
                            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                                <span style="font-size: 13px; font-weight: bold; color: #bd93f9;"><i class="fas fa-crop-alt"></i> 剪裁缩放与位置微调</span>
                                <div style="display: flex; gap: 8px;">
                                    <button id="btn-reset-live2d-transform" class="action-btn outline" style="padding: 3px 8px; font-size: 11px;"><i class="fas fa-undo"></i> 重置</button>
                                    <button id="btn-save-live2d-transform" class="action-btn" style="padding: 3px 10px; font-size: 11px; background: #bd93f9; border: none; color: #fff;"><i class="fas fa-save"></i> 保存布局</button>
                                </div>
                            </div>
                            <div style="display: grid; grid-template-columns: 80px 1fr 45px; gap: 10px; align-items: center; font-size: 12px; margin-bottom: 6px;">
                                <span><i class="fas fa-search-plus"></i> 缩放比例:</span>
                                <input type="range" id="live2d-scale-slider" min="0.4" max="2.5" step="0.05" value="1.0" class="modern-slider" style="accent-color: #bd93f9;">
                                <span id="live2d-scale-val" style="text-align: right; color: #bd93f9;">1.00x</span>
                            </div>
                            <div style="display: grid; grid-template-columns: 80px 1fr 45px; gap: 10px; align-items: center; font-size: 12px; margin-bottom: 6px;">
                                <span><i class="fas fa-arrows-alt-h"></i> X 轴水平:</span>
                                <input type="range" id="live2d-offset-x-slider" min="-150" max="150" step="1" value="0" class="modern-slider" style="accent-color: #8be9fd;">
                                <span id="live2d-offset-x-val" style="text-align: right; color: #8be9fd;">0px</span>
                            </div>
                            <div style="display: grid; grid-template-columns: 80px 1fr 45px; gap: 10px; align-items: center; font-size: 12px;">
                                <span><i class="fas fa-arrows-alt-v"></i> Y 轴垂直:</span>
                                <input type="range" id="live2d-offset-y-slider" min="-150" max="150" step="1" value="0" class="modern-slider" style="accent-color: #50fa7b;">
                                <span id="live2d-offset-y-val" style="text-align: right; color: #50fa7b;">0px</span>
                            </div>
                        </div>

                        <div style="margin-top: 15px; display: flex; gap: 8px; flex-wrap: wrap; justify-content: center;">
                            <button class="action-btn outline btn-test-live2d-emotion" data-emotion="normal"><i class="fas fa-smile"></i> 平常</button>
                            <button class="action-btn outline btn-test-live2d-emotion" data-emotion="happy"><i class="fas fa-laugh-beam" style="color: #ffb86c;"></i> 开心</button>
                            <button class="action-btn outline btn-test-live2d-emotion" data-emotion="shy"><i class="fas fa-flushed" style="color: #ff79c6;"></i> 害羞</button>
                            <button class="action-btn outline btn-test-live2d-emotion" data-emotion="angry"><i class="fas fa-angry" style="color: #ff5555;"></i> 生气</button>
                            <button class="action-btn outline btn-test-live2d-emotion" data-emotion="crying"><i class="fas fa-sad-tear" style="color: #8be9fd;"></i> 哭泣</button>
                            <button class="action-btn outline btn-test-live2d-emotion" data-emotion="sleeping"><i class="fas fa-bed" style="color: #bd93f9;"></i> 睡觉</button>
                        </div>
                        <p class="help-text" style="margin-top: 10px; text-align: center;"><i class="fas fa-info-circle" style="color: #8be9fd;"></i> 鼠标在上方移动即可实时视线跟随，调节上方滑块可实时剪裁/缩放/平移并保存！</p>
                    </div>

                    <!-- 普通 PNG 立绘预览与上传容器 -->
                    <div id="png-sprite-container">
                        <p style="font-size: 13px; color: #aaa; margin-bottom: 15px;">支持多图上传。系统会自动根据情绪分类并随机读取。注意上传会被限制只能选PNG文件。</p>
                        <div id="sprite-preview-container" style="display: flex; flex-direction: column; gap: 30px;">
                            <!-- JS 动态渲染各情绪图片 -->
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- 沉浸模式配置视图 -->
