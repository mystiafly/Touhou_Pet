        <section id="graph-view" class="content-section">
            <header class="section-header">
                <h1>🌊 人格海 (RAG 记忆向量星图)</h1>
                <p>可视化查看并管理当前角色在 Qdrant 向量数据库中的记忆表征与拓扑连线</p>
            </header>
            
            <div class="graph-toolbar" style="display: flex; gap: 10px; align-items: center; margin-bottom: 15px; flex-wrap: wrap;">
                <button id="refresh-graph-btn" class="action-btn" style="background: linear-gradient(135deg, #7928ca, #ff0080); color: white;">
                    <i class="fas fa-sync-alt"></i> 刷新星图
                </button>
                <button id="manual-distill-btn" class="action-btn success">
                    <i class="fas fa-compress-arrows-alt"></i> 整理今日回忆
                </button>
                <button id="seed-test-btn" class="action-btn outline">
                    <i class="fas fa-flask"></i> 注入测试回忆
                </button>
                <div style="margin-left: auto; position: relative;">
                    <input type="text" id="graph-search-input" placeholder="🔍 搜索记忆关键词..." style="padding: 6px 12px; border-radius: 20px; border: 1px solid var(--border-color); background: var(--bg-secondary); color: var(--text-color); font-size: 0.9em; width: 220px;">
                </div>
            </div>
            
            <div class="graph-canvas-wrapper" style="position: relative; border-radius: 12px; overflow: hidden; border: 1px solid var(--border-color);">
                <div id="graph-canvas-container" style="width: 100%; height: calc(100vh - 270px); min-height: 480px; background: #0f111a;"></div>
                
                <div class="graph-legend" style="position: absolute; bottom: 15px; left: 15px; background: rgba(15, 17, 26, 0.85); padding: 8px 14px; border-radius: 8px; backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.1);">
                    <span class="legend-item" style="margin-right: 15px;"><span class="legend-dot fact" style="display:inline-block; width:10px; height:10px; border-radius:50%; background:#ff79c6; margin-right:5px;"></span> 回忆事记切片</span>
                    <span class="legend-item"><span class="legend-dot entity" style="display:inline-block; width:10px; height:10px; border-radius:50%; background:#8be9fd; margin-right:5px;"></span> 关联概念实体</span>
                </div>
                
                <div id="graph-info-card" class="graph-info-panel hidden" style="position: absolute; top: 15px; right: 15px; width: 320px; background: rgba(15, 17, 26, 0.92); padding: 18px; border-radius: 12px; backdrop-filter: blur(12px); border: 1px solid rgba(255,121,198,0.4); box-shadow: 0 8px 32px rgba(0,0,0,0.5); z-index: 10;">
                    <h4 id="info-node-title" style="margin-top: 0; color: #ff79c6; font-size: 1.1em;">节点详情</h4>
                    <div class="info-content" style="margin: 12px 0;">
                        <p id="info-node-content" style="color: #e0e0e0; font-size: 0.95em; line-height: 1.5; white-space: pre-wrap; word-break: break-all;">点击星图中的记忆节点查看详情...</p>
                    </div>
                    <div style="display: flex; gap: 8px; margin-top: 15px;">
                        <button id="delete-node-btn" class="action-btn outline" style="border-color: #ff5555; color: #ff5555; font-size: 0.85em; width: 100%; justify-content: center;">
                            <i class="fas fa-trash-alt"></i> 从人格海中擦除
                        </button>
                    </div>
                </div>
            </div>
        </section>
