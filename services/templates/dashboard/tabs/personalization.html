                        </div>
                        <div style="text-align: center; margin-top: 8px;">
                            <span style="font-size: 13px; font-weight: 500;">深邃黑</span><br>
                            <span style="font-size: 11px; color: var(--text-muted);">#12121a · 默认</span>
                        </div>
                    </div>

                    <!-- 纯白 -->
                    <div class="bg-color-swatch" data-color="#f5f5f5" title="纯白">

                    </div>

                            <span style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 18px;">🍞</span>
                        </div>
                        <div style="text-align: center; margin-top: 8px;">

                    <div class="bg-color-swatch" data-color="#0d1117" title="深海蓝">

                    </div>

                    <!-- 暖夜棕 (推荐) -->
                    <div class="bg-color-swatch" data-color="#1a1410" title="暖夜棕">
                        <div style="width: 100%; height: 60px; border-radius: 8px; background: #1a1410; border: 2px solid rgba(255,255,255,0.15); position: relative;">
                            <span style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 18px;">🕯️</span>
