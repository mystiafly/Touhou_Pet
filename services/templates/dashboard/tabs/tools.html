<section id="tools-view" class="content-section" :class="{ active: activeView === 'tools-view' }">
            <header class="section-header">
                <h1>工具设置</h1>
                <p>当前 Chain 状态机中已注册且支持的大模型工具一览</p>
            </header>
            
            <div id="tools-container" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; padding-bottom: 30px;">
                <!-- Tools will be rendered here dynamically -->
                <div style="text-align: center; color: var(--text-color); grid-column: 1 / -1; padding: 40px;">
                    <i class="fas fa-spinner fa-spin fa-2x"></i>
                    <p style="margin-top: 15px;">正在加载工具列表...</p>
                </div>
            </div>
        </section>
