<div id="live2d-import-modal" class="modal-overlay hidden">
    <div class="modal-content">
        <div class="modal-header">
            <h2><i class="fas fa-file-archive" style="color: #ff79c6;"></i> 导入 Live2D 模型套装</h2>
            <button id="close-live2d-modal-btn" class="close-modal-btn"><i class="fas fa-times"></i></button>
        </div>
        <div class="modal-body">
            <div style="background: rgba(189, 147, 249, 0.1); padding: 12px 15px; border-radius: 8px; margin-bottom: 20px; border-left: 3px solid #bd93f9;">
                <p style="margin: 0; font-size: 13px; color: #f8f8f2; line-height: 1.5;">
                    支持导入标准的 Live2D 模型压缩包 (包含 <code>.model3.json</code>、<code>.moc3</code>、<code>textures/</code> 贴图)。<br>
                    导入后将自动解压并注册为当前角色的全新独立套装，由 <strong>Soullink 连续情感与微表情系统</strong> 全权驱动！
                </p>
            </div>

            <form id="live2d-import-form" onsubmit="return false;">
                <div class="form-group">
                    <label style="font-weight: 500; font-size: 14px;">方式一：选择本地 .zip 文件上传</label>
                    <div style="display: flex; gap: 10px; margin-top: 6px;">
                        <input type="file" id="live2d-file-input" accept=".zip" style="display: none;">
                        <button type="button" id="btn-choose-live2d-file" class="action-btn outline" style="flex: 1;">
                            <i class="fas fa-folder-open"></i> <span id="chosen-live2d-filename">选择 .zip 模型压缩包...</span>
                        </button>
                    </div>
                </div>

                <div style="display: flex; align-items: center; margin: 15px 0; color: #6272a4;">
                    <hr style="flex: 1; border: 0; border-top: 1px solid rgba(255,255,255,0.1);">
                    <span style="padding: 0 10px; font-size: 12px;">或</span>
                    <hr style="flex: 1; border: 0; border-top: 1px solid rgba(255,255,255,0.1);">
                </div>

                <div class="form-group">
                    <label for="live2d-local-path-input" style="font-weight: 500; font-size: 14px;">方式二：直接输入电脑本地压缩包路径</label>
                    <input type="text" id="live2d-local-path-input" class="modern-input" placeholder="例如: H:\新建文件夹\mao_zh-Hans.zip" style="width: 100%; margin-top: 6px;">
                    <p class="help-text">支持直接复制 Windows 绝对路径，无需经过浏览器上传，解压速度极快。</p>
                </div>

                <div class="form-group" style="margin-top: 15px;">
                    <label for="live2d-set-name-input" style="font-weight: 500; font-size: 14px;">套装命名 (选填，留空默认使用文件名)</label>
                    <input type="text" id="live2d-set-name-input" class="modern-input" placeholder="例如: mao_maid 或 米拉" style="width: 100%; margin-top: 6px;">
                </div>

                <div class="form-actions" style="margin-top: 25px; display: flex; justify-content: flex-end; gap: 10px;">
                    <button type="button" class="action-btn outline" id="btn-cancel-live2d-import">取消</button>
                    <button type="button" class="action-btn" id="btn-submit-live2d-import" style="background: linear-gradient(135deg, #bd93f9, #ff79c6); border: none; color: #fff;">
                        <i class="fas fa-magic"></i> 开始导入并设为当前套装
                    </button>
                </div>
                <p id="live2d-import-status" class="help-text" style="margin-top: 10px; text-align: right; display: none;"></p>
            </form>
        </div>
    </div>
