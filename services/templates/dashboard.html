<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>大贤者控制台 (Dashboard)</title>
    <link rel="stylesheet" href="/static/css/dashboard.css?v=1.42.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/vis-network/9.1.9/standalone/umd/vis-network.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <!-- Vue 3 Standalone Runtime -->
    <script src="/static/lib/vue/vue.global.prod.js"></script>
    <!-- Live2D Cubism Core & PixiJS & Soullink Driver -->
    <script src="/static/lib/live2d/live2dcubismcore.min.js"></script>
    <script src="/static/lib/live2d/pixi.min.js"></script>
    <script src="/static/lib/live2d/pixi-live2d-display.min.js"></script>
    <script src="/static/js/soullink_live2d.js?v=1.32.8"></script>
</head>
<body>

<div class="dashboard-container" id="vue-dashboard-app">
    <!-- 左侧边栏导航 -->
    <aside class="sidebar">
        <div class="brand">
            <i class="fas fa-microchip glow-icon"></i>
            <h2>大贤者系统</h2>
        </div>
        
        <nav class="nav-menu">
            <div style="font-size: 12px; color: #8be9fd; margin: 10px 0 5px 20px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px;">大贤者全局设定</div>
            <a href="#" class="nav-item" :class="{ active: activeView === 'dashboard-stats-view' }" @click.prevent="switchView('dashboard-stats-view')" data-target="dashboard-stats-view">
                <i class="fas fa-chart-pie"></i> 数据仪表盘
            </a>
            <a href="#" class="nav-item" :class="{ active: activeView === 'character-management-view' }" @click.prevent="switchView('character-management-view')" data-target="character-management-view">
                <i class="fas fa-users-cog"></i> 角色管理
            </a>
            <a href="#" class="nav-item" :class="{ active: activeView === 'engine-view' }" @click.prevent="switchView('engine-view')" data-target="engine-view">
                <i class="fas fa-brain"></i> 大脑引擎
            </a>
            <a href="#" class="nav-item" :class="{ active: activeView === 'allocation-view' }" @click.prevent="switchView('allocation-view')" data-target="allocation-view">
                <i class="fas fa-network-wired"></i> 大模型分配
            </a>
            <a href="#" class="nav-item" :class="{ active: activeView === 'tts-settings-view' }" @click.prevent="switchView('tts-settings-view')" data-target="tts-settings-view">
                <i class="fas fa-microphone-alt"></i> 语音设置
            </a>
            <a href="#" class="nav-item" :class="{ active: activeView === 'basic-settings-view' }" @click.prevent="switchView('basic-settings-view')" data-target="basic-settings-view">
                <i class="fas fa-sliders-h"></i> 基础设置
            </a>
            <a href="#" class="nav-item" :class="{ active: activeView === 'create-soul-view' }" @click.prevent="switchView('create-soul-view')" data-target="create-soul-view">
                <i class="fas fa-magic"></i> 孕育新灵魂
            </a>
            <a href="#" class="nav-item" :class="{ active: activeView === 'tools-view' }" @click.prevent="switchView('tools-view')" data-target="tools-view">
                <i class="fas fa-tools"></i> 工具设置
            </a>
            <a href="#" class="nav-item" :class="{ active: activeView === 'global-presets-view' }" @click.prevent="switchView('global-presets-view')" data-target="global-presets-view">
                <i class="fas fa-globe"></i> 公用预设
            </a>
            <a href="#" class="nav-item" :class="{ active: activeView === 'personalization-view' }" @click.prevent="switchView('personalization-view')" data-target="personalization-view">
                <i class="fas fa-palette"></i> 个性化
            </a>
            <a href="#" class="nav-item" :class="{ active: activeView === 'about-view' }" @click.prevent="switchView('about-view')" data-target="about-view">
                <i class="fas fa-info-circle"></i> 关于
            </a>

            <div style="font-size: 12px; color: #ff79c6; margin: 20px 0 5px 20px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px;">当前角色专属设定</div>
            <a href="#" class="nav-item" :class="{ active: activeView === 'character-settings-view' }" @click.prevent="switchView('character-settings-view')" data-target="character-settings-view">
                <i class="fas fa-user-tag"></i> 角色设置
            </a>
            <a href="#" class="nav-item" :class="{ active: activeView === 'custom-presets-view' }" @click.prevent="switchView('custom-presets-view')" data-target="custom-presets-view">
                <i class="fas fa-scroll"></i> 自定义预设
            </a>
            <a href="#" class="nav-item" :class="{ active: activeView === 'reactions-view' }" @click.prevent="switchView('reactions-view')" data-target="reactions-view">
                <i class="fas fa-bolt"></i> 动态应付词
            </a>
            <a href="#" class="nav-item" :class="{ active: activeView === 'databank-view' }" @click.prevent="switchView('databank-view')" data-target="databank-view">
                <i class="fas fa-database"></i> 动态数据库
            </a>
            <a href="#" class="nav-item" :class="{ active: activeView === 'logs-view' }" @click.prevent="switchView('logs-view')" data-target="logs-view">
                <i class="fas fa-history"></i> 对话回忆
            </a>
            <a href="#" class="nav-item" :class="{ active: activeView === 'graph-view' }" @click.prevent="switchView('graph-view')" data-target="graph-view">
                <i class="fas fa-project-diagram"></i> 记忆图谱
            </a>
            <a href="#" class="nav-item" :class="{ active: activeView === 'immersive-settings-view' }" @click.prevent="switchView('immersive-settings-view')" data-target="immersive-settings-view">
                <i class="fas fa-expand-arrows-alt"></i> 沉浸模式
            </a>
            <a href="#" class="nav-item" :class="{ active: activeView === 'sprite-settings-view' }" @click.prevent="switchView('sprite-settings-view')" data-target="sprite-settings-view">
                <i class="fas fa-images"></i> 立绘设置
            </a>
        </nav>

        <div class="sidebar-footer">
            <div class="status-indicator">
                <span class="status-dot"></span>
                <span>系统状态: 运行中</span>
            </div>
            <button class="action-btn" style="width: 100%; margin-top: 10px; padding: 8px; font-size: 13px; background: rgba(255, 85, 85, 0.2); border: 1px solid rgba(255, 85, 85, 0.4); color: #ff5555;" @click="config.restartApp()">
                <i class="fas fa-sync-alt"></i> 重启大贤者
            </button>
        </div>
    </aside>

    <!-- 主体视图片段容器 (由后端动态热装配) -->
    <main class="main-content">
        <!-- INCLUDE: tabs/dashboard_stats.html -->
        <!-- INCLUDE: tabs/engine.html -->
        <!-- INCLUDE: tabs/character_management.html -->
        <!-- INCLUDE: tabs/allocation.html -->
        <!-- INCLUDE: tabs/tts_settings.html -->
        <!-- INCLUDE: tabs/basic_settings.html -->
        <!-- INCLUDE: tabs/sprite_settings.html -->
        <!-- INCLUDE: tabs/immersive_settings.html -->
        <!-- INCLUDE: tabs/character_settings.html -->
        <!-- INCLUDE: tabs/logs.html -->
        <!-- INCLUDE: tabs/graph.html -->
        <!-- INCLUDE: tabs/create_soul.html -->
        <!-- INCLUDE: tabs/global_presets.html -->
        <!-- INCLUDE: tabs/about.html -->
        <!-- INCLUDE: tabs/personalization.html -->
        <!-- INCLUDE: tabs/custom_presets.html -->
        <!-- INCLUDE: tabs/reactions.html -->
        <!-- INCLUDE: tabs/databank.html -->
        <!-- INCLUDE: tabs/tools.html -->
    </main>

    <!-- 全局弹窗模态框 -->
    <!-- INCLUDE: modals/live2d_import.html -->
</div>

<!-- Vue 3 Modular Architecture & Full Composition API System -->
<script src="/static/js/dashboard/modules/useTheme.js?v=1.42.0"></script>
<script src="/static/js/dashboard/modules/useCharacter.js?v=1.42.0"></script>
<script src="/static/js/dashboard/modules/useTTS.js?v=1.42.0"></script>
<script src="/static/js/dashboard/modules/useDataBank.js?v=1.42.0"></script>
<script src="/static/js/dashboard/modules/useMemory.js?v=1.42.0"></script>
<script src="/static/js/dashboard/modules/useLive2DDebug.js?v=1.42.0"></script>
<script src="/static/js/dashboard/modules/useStatsLogs.js?v=1.42.0"></script>
<script src="/static/js/dashboard/modules/useConfig.js?v=1.42.0"></script>
<script src="/static/js/dashboard/dashboard_app.js?v=1.42.0"></script>
</body>
</html>
