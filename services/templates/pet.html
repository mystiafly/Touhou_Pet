<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Desktop Pet</title>
    <link rel="stylesheet" href="/static/css/pet.css?v=1.21.10">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Premium Interactive Network Graph Vis.js -->
    <script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/vis-network/9.1.9/standalone/umd/vis-network.min.js"></script>
</head>
<body>
<div class="pet-container">
    <!-- 沉浸模式背景壁纸与多媒体容器 -->
    <div id="immersive-wallpaper" class="immersive-wallpaper hidden"></div>
    <canvas id="immersive-particle-canvas" class="immersive-media hidden"></canvas>
    <video id="immersive-video-wallpaper" class="immersive-media hidden" autoplay loop muted playsinline></video>
    <iframe id="immersive-web-wallpaper" class="immersive-media hidden" frameborder="0"></iframe>

    <!-- 沉浸模式右上角时间日期控件 -->
    <div id="immersive-clock-container" class="immersive-clock-container hidden">
        <div id="immersive-clock-time">00:00</div>
        <div id="immersive-clock-date">2026年08月08日 星期六</div>
        <div class="immersive-exit-hint"><i class="fas fa-keyboard"></i> 按 ESC 键退出沉浸模式</div>
    </div>

    <div id="debug-coord-panel" style="display: none; position: fixed; top: 10px; left: 10px; background: rgba(0,0,0,0.85); color: #50fa7b; font-family: monospace; font-size: 11px; z-index: 99999; pointer-events: none; padding: 6px; border-radius: 4px; border: 1px solid #ff5555; line-height: 1.4;">
        Mouse: <span id="debug-mouse-val">N/A</span><br>
        ImgRect: <span id="debug-rect-val">N/A</span><br>
        Interactive: <span id="debug-interactive-val">N/A</span><br>
        Ignoring: <span id="debug-ignoring-val">N/A</span>
    </div>

    <!-- 沉浸模式右侧可折叠/展开的对话记录面板 -->
    <div id="immersive-chat-panel" class="immersive-chat-panel hidden">
        <div class="immersive-chat-header">
            <span><i class="fas fa-comments"></i> 对话记录</span>
            <button id="toggle-immersive-chat-btn" class="chat-toggle-btn" title="收起对话栏">
                <i class="fas fa-chevron-right"></i>
            </button>
        </div>
        <div id="immersive-chat-history" class="immersive-chat-history"></div>
    </div>

    <!-- 沉浸模式对话栏收起时的展开触发按钮 -->
    <div id="immersive-chat-trigger" class="immersive-chat-trigger hidden" title="展开对话栏">
        <i class="fas fa-comments"></i>
    </div>

    <!-- 头顶气泡 -->
    <div id="speech-bubble" class="bubble" style="opacity: 0;">
        <p id="bubble-content">...</p>
    </div>

    <div class="character-wrapper">
        <div id="fav-container" class="fav-container">
            <i class="fas fa-heart"></i> <span id="fav-score">...</span>
        </div>

        <img src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" id="pet-img" alt="Pet" draggable="false">
    </div>

    <!-- 悬浮网易云音乐播放器栏 -->
    <div id="music-player-bar" class="music-player-bar hidden">
        <div class="music-info">
            <i class="fas fa-music pulse-icon"></i>
            <div class="music-text">
                <span id="music-title">未在播放</span>
                <span id="music-artist">-</span>
            </div>
        </div>
        <div class="lyric-container">
            <span id="live-lyrics">当前未播放音乐</span>
        </div>
        <div class="music-controls">
            <button id="music-toggle-btn" class="ctrl-btn" title="播放/暂停">
                <i class="fas fa-play"></i>
            </button>
            <button id="music-stop-btn" class="ctrl-btn danger-btn" title="关闭播放器">
                <i class="fas fa-stop"></i>
            </button>
        </div>
    </div>

    <div class="input-bar">
        <button id="settings-btn" class="icon-btn" title="系统设置">
            <i class="fas fa-cog"></i>
        </button>

        <button id="presets-btn" class="icon-btn" title="快捷操作">
            <i class="fas fa-layer-group"></i>
        </button>

        <input type="text" id="pet-input" placeholder="和她说话..." autocomplete="off">

        <!-- 一级快捷操作菜单 -->
        <div id="action-popup" class="presets-popup hidden">
            <div class="preset-item" id="open-presets-btn">
                <i class="fas fa-comment-dots" style="color: #8be9fd;"></i> 预制对话
            </div>
            <div class="preset-item" id="open-tools-btn">
                <i class="fas fa-wrench" style="color: #ffb86c;"></i> 快速工具
            </div>
        </div>

        <!-- 快速工具弹出层 -->
        <div id="tools-popup" class="presets-popup hidden">
            <div class="preset-item" id="tool-read-process">
                <i class="fas fa-desktop" style="color: #50fa7b;"></i> 读取当前进程
            </div>
            <div class="preset-item" id="tool-clean-memory">
                <i class="fas fa-broom" style="color: #ff5555;"></i> 内存清理
            </div>
        </div>

        <!-- 预制发言弹出层 -->
        <div id="presets-popup" class="presets-popup hidden">
            <div class="preset-item" data-text="我现在有点无聊，你逗逗我吧。">
                <i class="fas fa-laugh-beam" style="color: #ffb86c;"></i> 无聊 (逗逗我吧)
            </div>
            <div class="preset-item" data-text="我现在有点不高兴，你安慰安慰我吧。">
                <i class="fas fa-sad-tear" style="color: #8be9fd;"></i> 伤心 (安慰我吧)
            </div>
            <div class="preset-item" data-text="我现在有点性欲，你诱惑诱惑我吧（进行nsfw描述）。">
                <i class="fas fa-heart" style="color: #ff5555;"></i> 色欲 (诱惑我吧)
            </div>
        </div>
    </div>
    <div id="settings-modal" class="settings-modal hidden">
        <div class="settings-content">
            <!-- 1. 主设置视图 -->
            <div id="settings-main-view" class="view-panel">
                <h3>系统设置</h3>
                <div class="settings-list">
                    <button id="open-dashboard-btn" class="menu-btn primary-btn">
                        <i class="fas fa-sliders-h"></i> 大贤者控制台
                    </button>
                    <button id="enter-immersive-btn" class="menu-btn success-btn" style="background: linear-gradient(135deg, #bd93f9, #ff79c6); border: none; color: #fff;">
                        <i class="fas fa-expand-alt"></i> 进入沉浸模式
                    </button>
                    <button id="minimize-btn" class="menu-btn warning-btn">
                        <i class="fas fa-minus"></i> 最小化至托盘
                    </button>
                    <button id="exit-game-btn" class="menu-btn danger">
                        <i class="fas fa-power-off"></i> 退出游戏
                    </button>
                </div>
                <button id="close-settings-btn" class="close-btn">关闭</button>
            </div>


        </div>
    </div>
</div>

<script src="/static/js/pet_script.js?v=1.21.10"></script>
</body>
</html>
