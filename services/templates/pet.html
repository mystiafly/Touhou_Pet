<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Desktop Pet</title>
    <link rel="stylesheet" href="/static/css/pet.css?v=1.31.3">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Live2D Cubism Core & PixiJS & Soullink Driver -->
    <script src="https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pixi.js@6.5.8/dist/browser/pixi.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pixi-live2d-display@0.4.0/dist/cubism4.min.js"></script>
    <script src="/static/js/soullink_live2d.js?v=1.31.3"></script>
</head>
<body>
<div class="pet-container">
    <!-- 沉浸模式背景壁纸与多媒体容器 -->
    <div id="immersive-wallpaper" class="immersive-wallpaper hidden"></div>
    <canvas id="immersive-particle-canvas" class="immersive-media hidden"></canvas>
    <video id="immersive-video-wallpaper" class="immersive-media hidden" autoplay loop muted playsinline></video>
    <iframe id="immersive-web-wallpaper" class="immersive-media hidden" frameborder="0"></iframe>

    <!-- 沉浸模式右上角时间日期与音乐控件 -->
    <div id="immersive-clock-container" class="immersive-clock-container hidden">
        <div id="immersive-clock-time">00:00</div>
        <div id="immersive-clock-date">2026年08月08日 星期六</div>
        <div class="immersive-controls-row">
            <button id="immersive-screenshot-btn" class="immersive-bgm-btn hidden" title="一键超高清截屏 (快捷键: P 或 F12)">
                <i class="fas fa-camera"></i> <span>高清截图</span>
            </button>
            <button id="immersive-bgm-toggle-btn" class="immersive-bgm-btn hidden" title="切换背景音乐开关">
                <i class="fas fa-volume-up"></i> <span id="immersive-bgm-status-text">BGM</span>
            </button>
        </div>
        <div class="immersive-exit-hint"><i class="fas fa-keyboard"></i> 按 ESC 退出 | 按 P 键一键截图</div>
    </div>

    <!-- 沉浸模式截屏快门闪光与 Toast 提醒 -->
    <div id="immersive-flash-overlay" class="immersive-flash-overlay hidden"></div>
    <div id="immersive-toast" class="immersive-toast hidden"></div>

    <div id="debug-coord-panel" style="display: none; position: fixed; top: 10px; left: 10px; background: rgba(0,0,0,0.85); color: #50fa7b; font-family: monospace; font-size: 11px; z-index: 99999; pointer-events: none; padding: 6px; border-radius: 4px; border: 1px solid #ff5555; line-height: 1.4;">
        Mouse: <span id="debug-mouse-val">N/A</span><br>
        ImgRect: <span id="debug-rect-val">N/A</span><br>
        Interactive: <span id="debug-interactive-val">N/A</span><br>
        Ignoring: <span id="debug-ignoring-val">N/A</span>
    </div>

    <!-- 沉浸模式右侧可折叠/展开的对话记录面板 -->
    <div id="immersive-chat-panel" class="immersive-chat-panel hidden">
        <div class="immersive-chat-header">
            <span><i class="fas fa-comments"></i> 对话记录</span>
            <button id="toggle-immersive-chat-btn" class="chat-toggle-btn" title="收起对话栏">
                <i class="fas fa-chevron-right"></i>
            </button>
        </div>
        <div id="immersive-chat-history" class="immersive-chat-history"></div>
    </div>

    <!-- 沉浸模式对话栏收起时的展开触发按钮 -->
    <div id="immersive-chat-trigger" class="immersive-chat-trigger hidden" title="展开对话栏">
        <i class="fas fa-comments"></i>
    </div>

    <!-- 桌面宠物核心舞台 (统一普通模式与沉浸模式的自适应垂直层级排版) -->
    <div class="pet-stage" id="pet-stage">
        <!-- 头顶气泡 -->
        <div id="speech-bubble" class="bubble" style="opacity: 0;">
            <div class="bubble-actions">
                <button id="bubble-tts-btn" class="bubble-action-btn" title="朗读当前对话 (TTS)">
                    <i class="fas fa-volume-up"></i>
                </button>
                <button id="bubble-thought-btn" class="bubble-action-btn hidden" title="观察角色思维链">
                    <i class="fas fa-brain"></i>
                </button>
            </div>
            <p id="bubble-content">...</p>
            <div id="bubble-thought-box" class="bubble-thought-box hidden">
                <div class="bubble-thought-header">
                    <span class="thought-title"><i class="fas fa-brain"></i> 角色内心思维链</span>
                    <span id="close-thought-btn" class="close-thought-btn" title="收起">&times;</span>
                </div>
                <div id="bubble-thought-content" class="bubble-thought-content"></div>
            </div>
        </div>

        <div class="character-wrapper">
            <div id="fav-container" class="fav-container">
                <i class="fas fa-heart"></i> <span id="fav-score">...</span>
            </div>

            <img src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" id="pet-img" alt="Pet" draggable="false">
            <canvas id="live2d-canvas" class="live2d-canvas hidden" style="width: 100%; height: 100%; object-fit: contain; pointer-events: auto;"></canvas>
        </div>

        <div class="input-bar">
            <button id="settings-btn" class="icon-btn" title="系统设置">
                <svg viewBox="0 0 512 512" width="18" height="18" fill="currentColor">
                    <path d="M495.9 166.6c3.2 8.7.5 18.4-6.4 24.6l-43.3 39.4c1.1 8.3 1.7 16.8 1.7 25.4s-.6 17.1-1.7 25.4l43.3 39.4c6.9 6.2 9.6 15.9 6.4 24.6l-43.3 118.9c-3.2 8.7-11.2 14.6-20.5 14.6-2.2 0-4.5-.4-6.7-1.3l-55.6-22.3c-12.7 8.8-26.6 16.1-41.4 21.6l-13.8 57.7c-2.4 10-11.4 17-21.7 17h-86.7c-10.3 0-19.3-7-21.7-17l-13.8-57.7c-14.8-5.5-28.7-12.8-41.4-21.6l-55.6 22.3c-2.2.9-4.5 1.3-6.7 1.3-9.3 0-17.3-5.9-20.5-14.6L4.1 345.4c-3.2-8.7-.5-18.4 6.4-24.6l43.3-39.4c-1.1-8.3-1.7-16.8-1.7-25.4s.6-17.1 1.7-25.4L10.5 191.2c-6.9-6.2-9.6-15.9-6.4-24.6L47.4 47.7c3.2-8.7 11.2-14.6 20.5-14.6 2.2 0 4.5.4 6.7 1.3l55.6 22.3c12.7-8.8 26.6-16.1 41.4-21.6L185.4 17c2.4-10 11.4-17 21.7-17h86.7c10.3 0 19.3 7 21.7 17l13.8 57.7c14.8 5.5 28.7 12.8 41.4 21.6l55.6-22.3c2.2-.9 4.5-1.3 6.7-1.3 9.3 0 17.3 5.9 20.5 14.6l43.3 118.9zM256 336c44.2 0 80-35.8 80-80s-35.8-80-80-80-80 35.8-80 80 35.8 80 80 80z"/>
                </svg>
            </button>

            <button id="presets-btn" class="icon-btn" title="快捷操作">
                <svg viewBox="0 0 512 512" width="18" height="18" fill="currentColor">
                    <path d="M12.41 148.02l232.94 105.67a32.062 32.062 0 0 0 25.3 0l232.94-105.67c16.55-7.51 16.55-32.53 0-40.04L270.65 2.31a32.062 32.062 0 0 0-25.3 0L12.41 107.98c-16.55 7.51-16.55 32.53 0 40.04zM12.41 292.02l232.94 105.67a32.062 32.062 0 0 0 25.3 0l232.94-105.67c16.55-7.51 16.55-32.53 0-40.04l-37.1 16.83-195.84 88.85a32.062 32.062 0 0 1-25.3 0L49.51 268.81l-37.1-16.83c-16.55 7.51-16.55 32.53 0 40.04zM12.41 436.02l232.94 105.67a32.062 32.062 0 0 0 25.3 0l232.94-105.67c16.55-7.51 16.55-32.53 0-40.04l-37.1 16.83-195.84 88.85a32.062 32.062 0 0 1-25.3 0L49.51 412.81l-37.1-16.83c-16.55 7.51-16.55 32.53 0 40.04z"/>
                </svg>
            </button>

            <input type="text" id="pet-input" placeholder="和她说话..." autocomplete="off">

            <!-- 一级快捷操作菜单 -->
            <div id="action-popup" class="presets-popup hidden">
                <div class="preset-item" id="open-presets-btn">
                    <i class="fas fa-comment-dots" style="color: #8be9fd;"></i> 预制对话
                </div>
                <div class="preset-item" id="open-tools-btn">
                    <i class="fas fa-wrench" style="color: #ffb86c;"></i> 快速工具
                </div>
            </div>

            <!-- 快速工具弹出层 -->
            <div id="tools-popup" class="presets-popup hidden">
                <div class="preset-item" id="tool-read-process">
                    <i class="fas fa-desktop" style="color: #50fa7b;"></i> 读取当前进程
                </div>
                <div class="preset-item" id="tool-clean-memory">
                    <i class="fas fa-broom" style="color: #ff5555;"></i> 内存清理
                </div>
            </div>

            <!-- 预制发言弹出层 -->
            <div id="presets-popup" class="presets-popup hidden">
                <div class="preset-item" data-text="我现在有点无聊，你逗逗我吧。">
                    <i class="fas fa-laugh-beam" style="color: #ffb86c;"></i> 无聊 (逗逗我吧)
                </div>
                <div class="preset-item" data-text="我现在有点不高兴，你安慰安慰我吧。">
                    <i class="fas fa-sad-tear" style="color: #8be9fd;"></i> 伤心 (安慰我吧)
                </div>
                <div class="preset-item" data-text="我现在有点性欲，你诱惑诱惑我吧（进行nsfw描述）。">
                    <i class="fas fa-heart" style="color: #ff5555;"></i> 色欲 (诱惑我吧)
                </div>
            </div>
        </div>
    </div>
    <div id="settings-modal" class="settings-modal hidden">
        <div class="settings-content">
            <!-- 1. 主设置视图 -->
            <div id="settings-main-view" class="view-panel">
                <h3>系统设置</h3>
                <div class="settings-list">
                    <button id="open-dashboard-btn" class="menu-btn primary-btn">
                        <i class="fas fa-sliders-h"></i> 大贤者控制台
                    </button>
                    <button id="enter-immersive-btn" class="menu-btn success-btn" style="background: linear-gradient(135deg, #bd93f9, #ff79c6); border: none; color: #fff;">
                        <i class="fas fa-expand-alt"></i> 进入沉浸模式
                    </button>
                    <button id="minimize-btn" class="menu-btn warning-btn">
                        <i class="fas fa-minus"></i> 最小化至托盘
                    </button>
                    <button id="exit-game-btn" class="menu-btn danger">
                        <i class="fas fa-power-off"></i> 退出游戏
                    </button>
                </div>
                <button id="close-settings-btn" class="close-btn">关闭</button>
            </div>
        </div>
    </div>
</div>

<script src="/static/js/pet/pet_audio.js?v=1.31.0"></script>
<script src="/static/js/pet/pet_immersive.js?v=1.31.0"></script>
<script src="/static/js/pet/pet_core.js?v=1.31.0"></script>
<script src="/static/js/pet_script.js?v=1.31.0"></script>
</body>
</html>
